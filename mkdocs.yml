site_name: YAMS
site_description: Yet Another Memory System — local, persistent memory for documents and applications.
site_url: https://yamsmemory.ai/
repo_url: https://github.com/trvon/yams
repo_name: trvon/yams
docs_dir: docs
site_dir: site
use_directory_urls: true

# Runtime prompts and packaged skills are source assets, not site pages.
exclude_docs: |
  prompts/**
  skills/**

nav:
  - Home: index.md
  - Get started:
      - Install and setup: install.md
      - Guide: guide.md
      - Build from source: BUILD.md
  - Reference:
      - Retrieval and freshness: cli-retrieval.md
      - P2P corpus sync: p2p.md
      - Runtime paths: architecture/runtime-paths.md
      - Configuration reading: architecture/config-reading.md
      - Environment overrides: architecture/environment-overrides.md
      - Retrieval contracts: architecture/retrieval_contracts.md
  - Benchmarks:
      - Results: benchmarks/index.md
      - Ingestion oracle: benchmarks/ingestion_oracle.md
  - Project:
      - Roadmap: roadmap.md
      - Newsletter: newsletter.md
      - Source mirroring: source-mirroring.md
      - Startup fuzzing: developer/startup_fuzzing.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  language: en
  font:
    text: "Outfit"
    code: "JetBrains Mono"
  logo: assets/yams.png
  favicon: assets/yams.png

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - toc:
      permalink: true
  - footnotes
  - meta
  - sane_lists
  - smarty
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/trvon/yams
      name: GitHub
    - icon: fontawesome/solid/code-branch
      link: https://git.trevon.dev/trevon/yams
      name: Self-hosted Git mirror
    - icon: fontawesome/solid/envelope
      link: mailto:support@yamsmemory.ai
      name: Email

extra_css:
  - assets/retro.css
extra_javascript: []
copyright: "© YAMS"
