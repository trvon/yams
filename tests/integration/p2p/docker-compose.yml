#
# P2P memory-sync container harness: two saged daemons (A, B) plus a MinIO
# container as an R2/S3 stand-in, and a shared volume for the filesystem
# backend. Both daemons run the version-vector + LWW sync loop against the
# shared store and must converge.
#
# Usage: docker compose -f tests/integration/p2p/docker-compose.yml up --build -d
#        scripts/run-p2p-container-harness.sh

services:
  saged-a:
    build:
      context: ../../..
      dockerfile: tests/integration/p2p/saged.Dockerfile
    command:
      ["--foreground", "--data-dir", "/data", "--config", "/cfg/config.toml"]
    environment:
      YAMS_CONFIG: /cfg/config.toml
      YAMS_DATA_DIR: /data
      YAMS_CLI_DISABLE_DAEMON_AUTOSTART: "1"
      YAMS_NON_INTERACTIVE: "1"
    volumes:
      - mem-store:/mem
      - ./config-a.toml:/cfg/config.toml:ro
    depends_on:
      - minio

  saged-b:
    build:
      context: ../../..
      dockerfile: tests/integration/p2p/saged.Dockerfile
    command:
      ["--foreground", "--data-dir", "/data", "--config", "/cfg/config.toml"]
    environment:
      YAMS_CONFIG: /cfg/config.toml
      YAMS_DATA_DIR: /data
      YAMS_CLI_DISABLE_DAEMON_AUTOSTART: "1"
      YAMS_NON_INTERACTIVE: "1"
    volumes:
      - mem-store:/mem
      - ./config-b.toml:/cfg/config.toml:ro
    depends_on:
      - minio

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    volumes:
      - minio-store:/data

volumes:
  mem-store:
  minio-store:
