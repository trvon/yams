# Short libFuzzer runs over the direct-P2P lane and the topology snapshot decoder. Each harness
# traps on an oracle violation, so any crash, sanitizer report, or oracle failure fails the job and
# its reproducer is uploaded. Long campaigns stay local (tools/fuzzing/fuzz.sh local|fuzz).
name: Fuzz Smoke

"on":
  pull_request:
    paths:
      - "src/daemon/p2p/**"
      - "include/yams/daemon/p2p/**"
      - "src/topology/topology_codec.cpp"
      - "include/yams/topology/topology_codec.h"
      - "tools/fuzzing/**"
      - ".github/workflows/fuzz-smoke.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per harness"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: fuzz-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: libFuzzer smoke (linux-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FUZZ_SECONDS: ${{ github.event.inputs.seconds || '60' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize required submodules
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          for module in third_party/sqlite-vec-cpp third_party/simeon third_party/symspell; do
            git submodule update --init --depth 1 "$module"
          done

      - name: Install toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/apt-get-with-retry.sh update
          # libclang-rt-18-dev provides the libFuzzer and sanitizer runtimes for clang-18.
          bash .github/scripts/apt-get-with-retry.sh \
            install -y --fix-missing --no-install-recommends \
            clang lld libclang-rt-18-dev ninja-build pkg-config libboost-all-dev
          PYTOOLS_DIR="${RUNNER_TEMP}/yams-python-tools"
          python3 -m venv "$PYTOOLS_DIR"
          "$PYTOOLS_DIR/bin/python" -m pip install --upgrade pip
          "$PYTOOLS_DIR/bin/python" -m pip install --upgrade 'conan==2.21.*' 'meson==1.4.*' 'ninja==1.11.*'
          echo "$PYTOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.conan2/p
            ~/.conan2/r
            ~/.conan2/recipes
            ~/.conan2/metadata
            ~/.conan2/s
          key: conan2-fuzz-${{ runner.os }}-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
          restore-keys: |
            conan2-fuzz-${{ runner.os }}-
            conan2-${{ runner.os }}-linux-x86_64-

      - name: Build libFuzzer harnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.conan2
          cp .conan/global.conf ~/.conan2/global.conf 2>/dev/null || true
          conan profile detect --force
          export YAMS_COMPILER=clang
          export ENABLE_TSAN=false
          export YAMS_EXTRA_MESON_FLAGS="-Dbuild-tests=false"
          ./setup.sh Fuzzing
          CONAN_BUILD_ENV="build/fuzzing/build-fuzzing/conan/conanbuild.sh"
          # shellcheck source=/dev/null
          if [ -f "$CONAN_BUILD_ENV" ]; then set +u; . "$CONAN_BUILD_ENV"; set -u; fi
          meson compile -C build/fuzzing -j 4 \
            fuzz_p2p_json fuzz_p2p_connstr fuzz_p2p_handshake fuzz_p2p_delta_stream \
            fuzz_p2p_inbound fuzz_p2p_protocol fuzz_p2p_delta fuzz_topology_codec

      - name: Generate seed corpus
        shell: bash
        run: bash tools/fuzzing/generate_corpus.sh

      - name: Run harnesses
        shell: bash
        run: |
          set -uo pipefail
          failed=()
          for target in p2p_json p2p_connstr p2p_handshake p2p_delta_stream p2p_inbound \
                        p2p_protocol p2p_delta topology_codec; do
            echo "::group::fuzz_${target} (${FUZZ_SECONDS}s)"
            if ! FUZZ_BUILD_DIR=build/fuzzing ./tools/fuzzing/fuzz.sh local "$target" \
                -max_total_time="${FUZZ_SECONDS}" -timeout=10 -rss_limit_mb=4096 \
                -print_final_stats=1; then
              failed+=("$target")
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::fuzz findings in: ${failed[*]}"
            exit 1
          fi

      - name: Upload reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-findings-${{ github.run_id }}
          path: build/fuzzing/fuzz-runs/*/artifacts/
          if-no-files-found: ignore
          retention-days: 14
