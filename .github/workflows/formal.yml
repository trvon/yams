# yamllint disable rule:line-length
# Runs formal verification checks:
# - lean: builds the Lean formalization in formal/topology via scripts/formal/check-lean.sh
# - tla: runs TLC on every TLA+ model config in formal/tla via scripts/formal/check-tla.sh
#   sharded into a 3-way parallel matrix (12 fast configs + the two 9.9M-state models).
name: Formal

'on':
  pull_request:
    paths:
      - 'formal/**'
      - 'scripts/formal/**'
      - '.github/workflows/formal.yml'
  push:
    branches: [main, experimental]
    paths:
      - 'formal/**'
      - 'scripts/formal/**'
      - '.github/workflows/formal.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # elan release and the sha256 of its linux x86_64 tarball. Upstream publishes
      # no checksums; this one was computed from the v4.2.3 release asset.
      ELAN_VERSION: v4.2.3
      ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            formal/topology/.lake
          key: formal-${{ runner.os }}-${{ env.ELAN_VERSION }}-${{ hashFiles('formal/topology/lean-toolchain', 'formal/topology/lake-manifest.json') }}

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            tmp=$(mktemp -d)
            curl -fsSL --proto '=https' --tlsv1.2 -o "$tmp/elan.tar.gz" \
              "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
            echo "${ELAN_SHA256}  $tmp/elan.tar.gz" | sha256sum -c -
            tar -xzf "$tmp/elan.tar.gz" -C "$tmp"
            "$tmp/elan-init" -y --no-modify-path --default-toolchain none
            rm -rf "$tmp"
          fi
          echo "$HOME/.elan/bin" >>"$GITHUB_PATH"

      - name: Install the pinned Lean toolchain
        working-directory: formal/topology
        run: |
          # A restored ~/.elan cache already has it, and elan fails on a reinstall.
          toolchain="$(cat lean-toolchain)"
          if ! elan toolchain list | grep -qF "${toolchain}"; then
            elan toolchain install "${toolchain}"
          fi
          lean --version

      - name: Build and check proofs
        run: scripts/formal/check-lean.sh

  tla:
    name: tla (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: fast
            args: --exclude ClientIoReset_new_wp --exclude ClientIoReset_new_rp
          - shard: client-io-reset-wp
            args: ClientIoReset_new_wp
          - shard: client-io-reset-rp
            args: ClientIoReset_new_rp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/cache@v4
        with:
          path: ~/.cache/yams/tla
          key: tla-${{ runner.os }}-${{ hashFiles('scripts/formal/check-tla.sh') }}
          restore-keys: |
            tla-${{ runner.os }}-

      - name: Check TLA+ models (${{ matrix.shard }})
        shell: bash
        run: |
          set -euo pipefail
          java -version
          scripts/formal/check-tla.sh ${{ matrix.args }}
