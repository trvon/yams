# yamllint disable rule:line-length
# The site itself is built and published by Cloudflare Pages. This check only
# fails a pull request whose docs would build with broken links or nav entries.
name: Docs

'on':
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

jobs:
  strict-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        # Same major version the published site is built with.
        run: python -m pip install 'mkdocs-material==9.*'

      - name: Build in strict mode
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
