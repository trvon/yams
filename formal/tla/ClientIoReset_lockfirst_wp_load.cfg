\* 6d5c9510a guard (try_lock_shared before reading the reset counter),
\* writer-preferring lock, unbounded load. Expect: pass (a waiting writer
\* stops new readers, so the lock drains).
SPECIFICATION Spec
CONSTANTS
    Reqs = {r1, r2}
    NIO = 2
    FailFast = TRUE
    WriterPref = TRUE
    MaxRetry = 1
    Recycle = TRUE
    CheckFirst = FALSE
INVARIANTS
    TypeOK
    NoIOThreadBlocked
    LockAccounting
    InUseOwned
    NoStaleAfterReset
    NoShutdownPoolUse
PROPERTIES
    RequestsEndRecycle
    ResetReturns
