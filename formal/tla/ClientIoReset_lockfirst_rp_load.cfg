\* 6d5c9510a guard (try_lock_shared before reading the reset counter),
\* reader-preferring lock (glibc), unbounded load of failing connects.
\* Expect: ResetReturns violated (reset() can starve).
SPECIFICATION Spec
CONSTANTS
    Reqs = {r1, r2}
    NIO = 2
    FailFast = TRUE
    WriterPref = FALSE
    MaxRetry = 1
    Recycle = TRUE
    CheckFirst = FALSE
INVARIANTS
    TypeOK
    NoIOThreadBlocked
    LockAccounting
    InUseOwned
    NoStaleAfterReset
    NoShutdownPoolUse
PROPERTIES
    RequestsEndRecycle
    ResetReturns
