    Reqs = {r1, r2, r3}
    NIO = 2
    FailFast = FALSE
    WriterPref = FALSE
    MaxRetry = 1
    Recycle = FALSE
    CheckFirst = FALSE
INVARIANTS
    TypeOK
    LockAccounting
    InUseOwned
    NoStaleAfterReset
